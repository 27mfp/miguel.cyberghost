# Runtime support: Python 3.9+
[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108"]
# The package intentionally exposes a historical module surface; F401 does not
# apply to the facade, which uses __getattr__ for live module state.
"cyberghost/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["cyberghost"]
branch = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise RuntimeError\\(\"cyberghost_runner must be imported",
]

[tool.mypy]
python_version = "3.9"
disable_error_code = ["import-untyped"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
files = ["cyberghost", "cyberghost_runner.py", "scripts"]
exclude = ["tests/"]
