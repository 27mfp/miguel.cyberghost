name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y shellcheck \
            qt6-declarative-dev-tools \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-shapes \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qttest

      - name: Validate tag, manifest and changelog
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          tag = os.environ["GITHUB_REF_NAME"]
          version = json.loads(pathlib.Path("manifest.json").read_text())["version"]
          if tag.lstrip("v") != version:
              raise SystemExit(f"tag {tag!r} does not match manifest version {version!r}")
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          if f"## {version}" not in changelog:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          print(f"release {version}: tag, manifest and changelog agree")
          PY

      - name: Validate plugin files
        run: |
          python -m py_compile cyberghost_runner.py cyberghost/*.py scripts/*.py
          python scripts/check_manifest.py
          python scripts/sync-preview.py --check
          for file in install.sh fresh-install.sh scripts/*.sh; do
            bash -n "$file"
          done
          shellcheck install.sh fresh-install.sh scripts/*.sh
          for file in *.qml tests/qml/*.qml tests/ui/*.qml tests/visual/*.qml; do
            /usr/lib/qt6/bin/qmlformat "$file" >/dev/null
          done
          git diff --check

      - name: Lint and types
        run: |
          ruff check .
          ruff format --check .
          mypy

      - name: Test
        run: |
          python -m pytest -q
          bash scripts/test-qml.sh

      - name: Package release and checksums
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')
          mkdir -p dist
          archive="dist/miguel.cyberghost-${version}.zip"
          git archive --format=zip --prefix="miguel.cyberghost/" -o "$archive" HEAD
          (
            cd dist
            sha256sum "$(basename "$archive")" >SHA256SUMS
          )
          python - "$version" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text()
          match = re.search(rf"^## {re.escape(version)}[^\n]*\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          body = match.group(1).strip() if match else "See CHANGELOG.md."
          pathlib.Path("dist/RELEASE_NOTES.md").write_text(body + "\n")
          PY
          ls -l dist
          cat dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/*.zip dist/SHA256SUMS
