name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    # Pinned so the ubuntu-latest move to 26.04 cannot silently change the Qt 6
    # packages the QML tests depend on; upgrade deliberately.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9: declared minimum. 3.14: what Omarchy ships.
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          # ruff is pinned to the version the code is formatted with.
          python -m pip install ruff==0.16.9 pytest requests
          sudo apt-get update
          sudo apt-get install -y shellcheck qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtqml-workerscript qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-templates

      - name: Lint backend
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest -q

      - name: Validate plugin files
        run: |
          python -m py_compile cyberghost_runner.py
          python -m json.tool manifest.json >/dev/null
          python scripts/check_manifest.py
          for file in install.sh fresh-install.sh scripts/*.sh; do
            bash -n "$file"
          done
          shellcheck install.sh fresh-install.sh scripts/*.sh
          # qmlformat parses every QML file. Formatter output differs between
          # the Ubuntu Qt version and Omarchy's Qt version, so do not compare it.
          for file in *.qml tests/qml/*.qml tests/ui/*.qml tests/visual/*.qml; do
            /usr/lib/qt6/bin/qmlformat "$file" >/dev/null
          done
          bash scripts/test-qml.sh
          if command -v omarchy-plugin-validate >/dev/null 2>&1; then
            omarchy-plugin-validate "$PWD"
          else
            echo "Omarchy validator unavailable on Ubuntu; standalone manifest validation ran above."
          fi
          # Installed Omarchy + Quickshell metadata is needed for real import
          # linting. Run scripts/check_qml.py on the target machine; the test
          # doubles above are not evidence of full shell integration.
          git diff --check
