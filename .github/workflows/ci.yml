name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install ruff pytest requests
          sudo apt-get update
          sudo apt-get install -y shellcheck qt6-declarative-dev-tools qml6-module-qttest

      - name: Lint backend
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest -q

      - name: Validate plugin files
        run: |
          python -m py_compile cyberghost_runner.py
          python -m json.tool manifest.json >/dev/null
          bash -n install.sh install-helper.sh fresh-install.sh
          shellcheck install.sh install-helper.sh fresh-install.sh
          # Quickshell/Omarchy modules are unavailable on Ubuntu; unresolved
          # imports remain warnings while QML syntax errors still fail the lint.
          /usr/lib/qt6/bin/qmllint --ignore-settings --disable-plugins --max-warnings=-1 Panel.qml Service.qml GhostIcon.qml
          for file in Panel.qml Service.qml GhostIcon.qml tests/qml/*.qml; do
            diff -u "$file" <(/usr/lib/qt6/bin/qmlformat --settings .qmlformat.ini "$file")
          done
          /usr/lib/qt6/bin/qmltestrunner -input tests/qml -platform offscreen
          git diff --check
