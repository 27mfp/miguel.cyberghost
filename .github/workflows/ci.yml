name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install ruff pytest

      - name: Lint backend
        run: ruff check .

      - name: Run tests
        run: pytest -q

      - name: Validate plugin files
        run: |
          python -m py_compile cyberghost_runner.py
          python -m json.tool manifest.json >/dev/null
          bash -n install.sh install-helper.sh fresh-install.sh
          git diff --check
