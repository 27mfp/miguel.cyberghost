name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Pinned so the ubuntu-latest move to 26.04 cannot silently change the
    # toolchain; upgrade deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Ruff lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Static types
        run: mypy

      - name: Shell syntax and ShellCheck
        run: |
          for file in install.sh fresh-install.sh scripts/*.sh; do
            bash -n "$file"
          done
          shellcheck install.sh fresh-install.sh scripts/*.sh

      - name: Shell formatting (shfmt)
        run: |
          curl -fsSL -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          chmod +x /tmp/shfmt
          /tmp/shfmt -i 2 -ci -d install.sh fresh-install.sh scripts/*.sh

      - name: Python and manifest validation
        run: |
          python -m py_compile cyberghost_runner.py cyberghost/*.py scripts/*.py
          python -m json.tool manifest.json >/dev/null
          python scripts/check_manifest.py
          python scripts/sync-preview.py --check
          git diff --check

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9: declared minimum. 3.14: what Omarchy ships.
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install pytest pytest-cov requests

      - name: Run tests with coverage
        run: python -m pytest -q --cov=cyberghost --cov-report=term-missing

  qml:
    # The QML suite needs Qt 6; it does not need a Quickshell process.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-declarative-dev-tools \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-shapes \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qttest

      - name: Parse every QML file
        # qmlformat output differs between Ubuntu's Qt and Omarchy's Qt, so this
        # is a parse check only; formatting is reviewed against .qmlformat.ini.
        run: |
          for file in *.qml tests/qml/*.qml tests/ui/*.qml tests/visual/*.qml; do
            /usr/lib/qt6/bin/qmlformat "$file" >/dev/null
          done

      - name: Run QML behaviour tests
        run: bash scripts/test-qml.sh

      - name: Omarchy manifest validator (when installed)
        run: |
          if command -v omarchy-plugin-validate >/dev/null 2>&1; then
            omarchy-plugin-validate "$PWD"
          else
            echo "Omarchy validator unavailable on Ubuntu; standalone manifest validation ran in the lint job."
          fi

      - name: Native import lint limitation
        run: |
          # scripts/check_qml.py needs the installed Omarchy shell imports.
          echo "Run scripts/check_qml.py on the target Omarchy machine; test doubles are not shell evidence."
